name: Regression tests
on:
  pull_request:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  workflows:
    name: Validate GitHub Actions workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color
  phpunit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
    env:
      WORDPRESS_IMAGE: wordpress:7.1.2-php${{ matrix.php }}-apache
    steps:
      - uses: actions/checkout@v4
      - name: Prepare disposable WordPress integration site
        run: tests/bin/setup.sh
      - name: Run unit and WordPress integration regressions
        run: tests/bin/run.sh
      - name: Collect runtime diagnostics
        if: failure()
        run: |
          mkdir -p artifacts
          docker compose -f tests/compose.yaml logs --no-color > artifacts/containers.log
          docker compose -f tests/compose.yaml exec -T wordpress cat wp-content/debug.log > artifacts/wordpress-debug.log || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: diagnostics-php-${{ matrix.php }}
          path: artifacts/
          retention-days: 3
  javascript:
    name: Validate assets and release preparation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Run editor asset regressions
        run: |
          npm run check:js
          npm run test:js
      - name: Validate release preparation without publishing
        run: >-
          npm run release -- patch --ci
          --no-git.commit --no-git.tag --no-git.push --no-github.release
          --no-git.requireBranch --no-git.requireUpstream
